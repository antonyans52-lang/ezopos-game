<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Եզոպոսի առակների աշխարհում</title>
<style>
:root{--ink:#2b2340;--purple:#6356a6;--cream:#fffaf0;--gold:#e7ad42;--green:#27866a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Armenian",sans-serif;color:var(--ink);background:linear-gradient(135deg,#dff4f0,#f9e8c8);padding:18px}.app{max-width:760px;margin:auto;background:var(--cream);border:1px solid #eadbbd;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #34254a20}.hero{padding:26px 24px 22px;text-align:center;background:linear-gradient(120deg,#5b4b91,#8276bd);color:white}.hero .emoji{font-size:42px}.hero h1{margin:8px 0;font-size:clamp(24px,5vw,36px)}.hero p{margin:0;opacity:.92}.content{padding:22px}.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:18px}.pill{background:#f3ead8;border-radius:999px;padding:8px 13px}.question{font-size:clamp(19px,4vw,24px);line-height:1.55;font-weight:750;margin:14px 0}.storypic{font-size:70px;text-align:center;padding:12px;background:#eaf3df;border-radius:18px;margin:14px 0}.answers{display:grid;gap:10px;margin-top:16px}.answer{font:inherit;text-align:left;padding:14px 16px;border:2px solid #ded6ee;border-radius:14px;background:white;color:var(--ink);cursor:pointer;transition:.15s}.answer:hover:not(:disabled){border-color:var(--purple);transform:translateY(-1px)}.answer:disabled{cursor:default}.answer.correct{background:#e1f6e9;border-color:#4aab76}.answer.wrong{background:#ffebdf;border-color:#dc795b}.feedback{min-height:28px;margin:14px 0;font-weight:700}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:750;cursor:pointer;background:var(--purple);color:white}.btn.secondary{background:#e8e2f4;color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}.progress{height:8px;background:#eee7dc;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:var(--gold);transition:width .2s}.result{text-align:center;padding:20px 4px}.result .big{font-size:64px}.result h2{font-size:28px}.small{font-size:13px;color:#706780;text-align:center;padding:0 18px 18px}@media(max-width:480px){body{padding:8px}.content{padding:16px}.hero{padding:20px 14px}}
</style></head>
<body><main class="app"><header class="hero"><div class="emoji">🦊 📖 🐦‍⬛</div><h1>Եզոպոսի առակների աշխարհում</h1><p>Կարդա հարցը, ընտրիր պատասխանը և հավաքիր միավորներ։</p></header><section class="content" id="game"><div class="topline"><span class="pill" id="count">Հարց 1 / 10</span><span class="pill">⭐ Միավորներ՝ <span id="score">0</span></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="storypic" id="pic" aria-hidden="true"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="restart">Սկսել սկզբից ↺</button><button class="btn" id="next" disabled>Հաջորդը →</button></div></section><div class="small">Ուսումնական խաղ․ յուրաքանչյուր ճիշտ պատասխանը՝ 10 միավոր։</div></main>
<script>
const qs=[
{q:'Ո՞ր կենդանին է խաբում ագռավին՝ պանիրը վերցնելու համար։',pic:'🦊 🧀 🐦‍⬛',a:['Գայլը','Աղվեսը','Առյուծը','Նապաստակը'],c:1,why:'Աղվեսը գովեստով ստիպում է ագռավին բացել կտուցը, և պանիրն ընկնում է։'},
{q:'«Կրիան և նապաստակը» առակում ո՞վ է հաղթում մրցավազքում։',pic:'🐢 🏁 🐇',a:['Նապաստակը','Կրիան','Աղվեսը','Ոչ ոք'],c:1,why:'Կրիան համառորեն շարունակում է ճանապարհը, իսկ ինքնավստահ նապաստակը ժամանակ է կորցնում։'},
{q:'«Առյուծը և մուկը» առակում մուկն ինչպե՞ս է օգնում առյուծին։',pic:'🦁 🐭 🪢',a:['Սնունդ է բերում','Արթնացնում է անտառը','Կրծում է ցանցը','Ցույց է տալիս ճանապարհը'],c:2,why:'Փոքրիկ մուկը կրծում է ցանցը և ազատում առյուծին։'},
{q:'«Գայլը և գառը» առակում գայլը ինչո՞վ է փորձում արդարացնել իր պահվածքը։',pic:'🐺 💧 🐑',a:['Անհիմն մեղադրանքներով','Նվեր տալով','Ներողություն խնդրելով','Մրցույթ առաջարկելով'],c:0,why:'Գայլը տարբեր անհիմն պատճառաբանություններ է հորինում՝ գառին մեղադրելու համար։'},
{q:'«Աղվեսն ու խաղողը» առակում աղվեսն ինչո՞ւ է հեռանում։',pic:'🦊 🍇',a:['Խաղողը չափազանց թթու է համարում','Խաղողը հասուն է','Նրան կանչում են','Վախենում է անձրևից'],c:0,why:'Չհասնելով խաղողին՝ աղվեսը հայտարարում է, թե այն թթու է։'},
{q:'«Մրջյունն ու մորեխը» առակում մրջյունն ինչո՞վ է զբաղված ամռանը։',pic:'🐜 🌾 🎵',a:['Երգում է ամբողջ օրը','Պաշար է հավաքում','Քնում է','Ճանապարհորդում է'],c:1,why:'Մրջյունը աշխատում ու պաշար է հավաքում ձմռան համար։'},
{q:'Ո՞րն է «Աղվեսն ու խաղողը» առակի հիմնական միտքը։',pic:'🍇 💭 🦊',a:['Պետք է միշտ շտապել','Չստացածը երբեմն արժեզրկում ենք','Պետք չէ խաղող ուտել','Բոլորն են միշտ ճիշտ'],c:1,why:'Մարդիկ երբեմն նսեմացնում են այն, ինչին չեն կարողանում հասնել։'},
{q:'«Հովիվ տղան և գայլը» պատմության մեջ ինչո՞ւ մարդիկ այլևս չեն հավատում տղային։',pic:'👦 🐑 🔔',a:['Նա մոլորվում է','Նա հաճախ սուտ ահազանգ է տալիս','Նա լուռ է մնում','Նա ոչխար չի պահում'],c:1,why:'Կեղծ ահազանգերը մարդկանց սովորեցնում են չվստահել նրան։'},
{q:'Առակները սովորաբար ի՞նչ են փոխանցում ընթերցողին։',pic:'📚 💡',a:['Միայն թվեր','Բարոյական խրատ կամ դաս','Միայն եղանակի կանխատեսում','Խոհարարական բաղադրատոմս'],c:1,why:'Առակները կարճ պատմություններ են, որոնք հաճախ ավարտվում են բարոյական դասով։'},
{q:'Եզոպոսի առակներում կենդանիները հաճախ ինչպե՞ս են ներկայացվում։',pic:'🦁 🦊 🐢',a:['Խոսում ու գործում են մարդկանց նման','Միշտ լուռ են','Միայն որպես զարդարանք','Երբեք չեն հանդիպում'],c:0,why:'Կենդանիները հաճախ ներկայացվում են մարդկային բնավորության գծերով։'}];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;const x=qs[i];$('count').textContent=`Հարց ${i+1} / ${qs.length}`;$('score').textContent=score;$('bar').style.width=`${i/qs.length*100}%`;$('question').textContent=x.q;$('pic').textContent=x.pic;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=i===qs.length-1?'Տեսնել արդյունքը 🏆':'Հաջորդը →';$('answers').innerHTML='';x.a.forEach((t,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>choose(n,b);$('answers').appendChild(b)})}function choose(n,b){if(locked)return;locked=true;const x=qs[i];[...$('answers').children].forEach((el,j)=>{el.disabled=true;if(j===x.c)el.classList.add('correct')});if(n===x.c){score+=10;$('feedback').textContent='Ճիշտ է՛։ '+x.why}else{b.classList.add('wrong');$('feedback').textContent='Այս անգամ ոչ։ '+x.why}$('score').textContent=score;$('bar').style.width=`${(i+1)/qs.length*100}%`;$('next').disabled=false}function finish(){$('game').innerHTML=`<div class="result"><div class="big">${score===100?'🏆':score>=70?'🌟':'📚'}</div><h2>Խաղն ավարտված է։</h2><p>Քո արդյունքը՝ <strong>${score} / 100</strong></p><p>${score===100?'Հրաշալի՛ է։ Դու իսկական առակագետ ես։':score>=70?'Շատ լավ արդյունք։ Շարունակի՛ր սովորել։':'Լավ փորձ էր։ Կրկին խաղա և բացահայտիր առակների խրատները։'}</p><button class="btn" id="again">Կրկին խաղալ ↺</button></div>`;$('again').onclick=()=>{i=0;score=0;location.reload()}}$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('restart').onclick=()=>{i=0;score=0;render()};render();
</script></body></html>
